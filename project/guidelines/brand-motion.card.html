<!-- @dsCard group="Brand" viewport="700x180" subtitle="220ms/340ms eased hover states" name="Motion Timing" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:24px;background:var(--bg-page);display:flex;gap:20px">
<button style="padding:13px 26px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;font-family:inherit;cursor:pointer;transition:background var(--dur-med) var(--ease-standard),color var(--dur-med) var(--ease-standard),transform var(--dur-fast) var(--ease-standard)" onmouseover="this.style.background='var(--accent)';this.style.color='var(--ivory)';this.style.transform='scale(1.03)'" onmouseout="this.style.background='transparent';this.style.color='var(--ink)';this.style.transform='none'">Hover me</button>
<div style="font-size:12px;color:var(--ink-70);align-self:center;max-width:380px">Buttons: outline → solid fill + 1.03 scale, 340ms. Cards: lift + soft shadow. Nav: underline draws in. All eased, never instant or bouncy.</div>
</div>
