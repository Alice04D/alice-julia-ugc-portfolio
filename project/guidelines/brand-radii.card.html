<!-- @dsCard group="Brand" viewport="700x150" subtitle="Rounded corners, card & phone shadows" name="Radii & Shadows" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:24px;background:var(--bg-page);display:flex;gap:24px;align-items:center">
<div style="width:100px;height:70px;background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font-size:11px">sm / card</div>
<div style="width:100px;height:70px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card-hover);display:flex;align-items:center;justify-content:center;font-size:11px">md / hover</div>
<div style="width:100px;height:70px;background:var(--ink);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;color:var(--ivory);font-size:11px">lg / panel</div>
<div style="width:70px;height:70px;background:var(--accent);border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;color:var(--ivory);font-size:11px">pill</div>
</div>
