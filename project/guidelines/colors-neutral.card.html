<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:100%;font-family:var(--font-sans)">
<div style="flex:1;background:var(--surface);color:var(--ink);display:flex;align-items:end;padding:10px;font-size:12px;border-right:1px solid #ddd0c1">--surface #ffffff</div>
<div style="flex:1;background:var(--surface-alt);color:var(--ink);display:flex;align-items:end;padding:10px;font-size:12px">--surface-alt #eee6da</div>
<div style="flex:1;background:var(--ink-70);color:var(--ivory);display:flex;align-items:end;padding:10px;font-size:12px">--ink-70 #5c4f47</div>
<div style="flex:1;background:var(--ink-40);color:var(--ink);display:flex;align-items:end;padding:10px;font-size:12px">--ink-40 #a89a90</div>
<div style="flex:1;background:var(--border);color:var(--ink);display:flex;align-items:end;padding:10px;font-size:12px">--border #ddd0c1</div>
</div>
