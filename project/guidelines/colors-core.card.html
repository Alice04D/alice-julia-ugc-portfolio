<!-- @dsCard group="Colors" viewport="700x180" subtitle="Ink, ivory, rose accent" name="Core Palette" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:100%;font-family:var(--font-sans)">
<div style="flex:1;background:var(--ink);color:var(--ivory);display:flex;align-items:end;padding:10px;font-size:12px">--ink #221b18</div>
<div style="flex:1;background:var(--ivory);color:var(--ink);display:flex;align-items:end;padding:10px;font-size:12px;border-right:1px solid #ddd0c1">--ivory #f6f1ea</div>
<div style="flex:1;background:var(--accent);color:var(--ivory);display:flex;align-items:end;padding:10px;font-size:12px">--accent #7a2330</div>
<div style="flex:1;background:var(--accent-deep);color:var(--ivory);display:flex;align-items:end;padding:10px;font-size:12px">--accent-deep #4f141c</div>
</div>
